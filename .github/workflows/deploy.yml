name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch each app's docs, Tisty's from its latest release
        run: npm run wikis

      - name: Fetch each app's hero, mascot and icon
        run: npm run assets

      - name: Check types
        run: npm run check

      - name: Build
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build each app's own site
        run: |
          npm run build:tisty
          npm run build:linkunbound
          npm run build:copanda
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep the build for Cloudflare
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: ./dist
          retention-days: 1

      - name: Keep the apps' builds for Cloudflare
        uses: actions/upload-artifact@v7
        with:
          name: site-apps
          path: |
            ./dist-tisty
            ./dist-linkunbound
            ./dist-copanda
          retention-days: 1

  cloudflare:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: The IndexNow script
        uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/indexnow.sh
          sparse-checkout-cone-mode: false

      - name: The build
        if: env.HAS_TOKEN == 'true'
        uses: actions/download-artifact@v8
        with:
          name: site
          path: ./dist

      - name: What search engines were told last
        if: env.HAS_TOKEN == 'true'
        run: curl -fsSL https://rgdevment.com/sitemap.xml -o live-sitemap.xml || touch live-sitemap.xml

      - name: Deploy to Cloudflare Pages
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=rgdevment --branch=main --commit-dirty=true

      - name: Tell search engines what changed
        if: env.HAS_TOKEN == 'true'
        continue-on-error: true
        run: bash scripts/indexnow.sh rgdevment.com dist/sitemap.xml live-sitemap.xml ${{ github.event_name }}

  cloudflare-apps:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - { app: tisty, host: www.tisty.app }
          - { app: linkunbound, host: www.linkunbound.app }
          - { app: copanda, host: www.copanda.app }
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: The IndexNow script
        uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/indexnow.sh
          sparse-checkout-cone-mode: false

      - name: The builds
        if: env.HAS_TOKEN == 'true'
        uses: actions/download-artifact@v8
        with:
          name: site-apps
          path: .

      - name: What search engines were told last
        if: env.HAS_TOKEN == 'true'
        run: curl -fsSL https://${{ matrix.host }}/sitemap.xml -o live-sitemap.xml || touch live-sitemap.xml

      - name: Deploy to Cloudflare Pages
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist-${{ matrix.app }} --project-name=${{ matrix.app }} --branch=main --commit-dirty=true

      - name: Tell search engines what changed
        if: env.HAS_TOKEN == 'true'
        continue-on-error: true
        run: bash scripts/indexnow.sh ${{ matrix.host }} dist-${{ matrix.app }}/sitemap.xml live-sitemap.xml ${{ github.event_name }}
